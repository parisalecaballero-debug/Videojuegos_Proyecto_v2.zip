<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa: #ff6fb5;
            --rosa-suave: #ffd6ec;
            --lavanda: #b185db;
            --lavanda-suave: #e9dcf9;
            --menta: #a8e6cf;
            --amarillo: #ffe08a;
            --texto: #4a3b52;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff9fb;
            background-image: radial-gradient(var(--rosa-suave) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--texto);
        }
        .navbar {
            background: linear-gradient(90deg, var(--rosa) 0%, var(--lavanda) 100%) !important;
        }
        .navbar-brand {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700 !important;
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 600 !important;
        }
        h1, h2, h3 {
            font-family: 'Baloo 2', sans-serif;
            color: var(--lavanda);
            font-weight: 700;
        }
        .btn-primary {
            background-color: var(--rosa);
            border-color: var(--rosa);
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #e85aa0;
            border-color: #e85aa0;
        }
        .btn-success {
            background-color: var(--lavanda);
            border-color: var(--lavanda);
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-success:hover {
            background-color: #9c6bc7;
            border-color: #9c6bc7;
        }
        .btn-warning {
            background-color: var(--rosa-suave);
            border-color: var(--rosa);
            color: var(--texto);
            border-radius: 50px;
            font-weight: 600;
        }
        .form-control {
            border-radius: 15px;
            border: 2px solid var(--lavanda-suave);
        }
        .form-control:focus {
            border-color: var(--rosa);
            box-shadow: 0 0 0 0.25rem rgba(255, 111, 181, 0.25);
        }
        .table {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .table thead {
            background-color: var(--lavanda-suave);
        }
        .alert-danger {
            background-color: #ffe0ec;
            color: #c2185b;
            border: none;
            border-radius: 15px;
        }
        .alert-success {
            background-color: var(--lavanda-suave);
            color: var(--lavanda);
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">🎮 BITACORA DE VIDEOJUEGOS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                <a class="nav-link" href="{% url 'acerca' %}">Acerca de</a>
             <a class="nav-link" href="{% url 'mi_progreso' %}">Mi Progreso</a>
                {% if request.session.usuario %}
                    <a class="nav-link" href="{% url 'consultar' %}">Consultar</a>
                    <a class="nav-link" href="{% url 'registrar' %}">Registrar</a>
                    <a class="nav-link" href="{% url 'logout' %}">Cerrar sesión ({{ request.session.usuario }})</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
